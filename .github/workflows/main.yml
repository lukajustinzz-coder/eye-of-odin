name: Build Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build with Gradle
      working-directory: eye-of-odin-mod-source/eye-of-odin
      run: gradle build

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiled-mod
        path: eye-of-odin-mod-source/eye-of-odin/build/libs/*.jar
